[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-tool"
version = "0.1.0"
description = "Multi-source OSINT lookup: fan a single query out across free-tier APIs and correlate the results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "osint-tool contributors" }]
keywords = ["osint", "recon", "username", "email", "security", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
osint-tool = "osint_tool.cli:app"

[project.urls]
Homepage = "https://github.com/malkhurayji/osint-tool"
Issues = "https://github.com/malkhurayji/osint-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["osint_tool"]

[tool.hatch.build.targets.wheel.force-include]
"osint_tool/data/disposable_domains.txt" = "osint_tool/data/disposable_domains.txt"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
